<body>

<main id="welcome" class="screen">
 <div class="art">
  <button class="welcome-hit"
   aria-label="Welcome"
   onclick="showMenu()"></button>
 </div>
</main>

<section id="menu" class="screen">
 <div class="office-art">
  <button class="office-hit new-career"
   aria-label="New Career"
   onclick="openCareer()"></button>

  <button class="office-hit continue-career"
   aria-label="Continue Career"
   onclick="continueCareer()"></button>

  <button class="office-hit how-to-play"
   aria-label="How to Play"
   onclick="officeAction('help')"></button>

  <button class="office-hit settings"
   aria-label="Settings"
   onclick="officeAction('settings')"></button>

  <button class="office-hit back"
   aria-label="Back"
   onclick="returnWelcome()"></button>
 </div>
</section>

<script>
function showMenu(){
 document.getElementById('welcome').style.display='none';
 document.getElementById('menu').style.display='flex';
}
function returnWelcome(){
 document.getElementById('menu').style.display='none';
 document.getElementById('welcome').style.display='flex';
}
function officeAction(action){
 const messages={
  new:'New Career screen coming next!',
  continue:'No saved career yet.',
  help:'How to Play screen coming soon.',
  settings:'Settings screen coming soon.'
 };
 alert(messages[action] || 'Coming soon.');
}
</script>

<section id="career" class="screen">
 <div class="game-art career-art">
  <input id="managerName" class="name-input"
   placeholder="Your name" maxlength="28"
   aria-label="Manager name">
  <button class="hit career-choose"
   aria-label="Choose Your Club"
   onclick="openClubs()"></button>
  <button class="hit career-start"
   aria-label="Start Career"
   onclick="startCareer()"></button>
  <button class="hit career-back"
   aria-label="Back"
   onclick="showOffice()"></button>
 </div>
</section>

<section id="clubs" class="screen">
 <div class="game-art club-art" id="clubBoard">
  <button class="hit club-back"
   aria-label="Back"
   onclick="backToCareer()"></button>
  <button class="hit club-confirm"
   aria-label="Confirm Club"
   onclick="confirmClub()"></button>
 </div>
</section>

<script>
const teams=[
 'Westbridge United','Redmoor Athletic','Ironvale FC',
 'Brookfield Town','Seabourne FC','Oakchester United',
 'Kingsford Town','Ashbourne Rovers','Northwick Albion',
 'Eastport City','Ravenshill FC','Ledgemont Athletic'
];
let pendingClub=-1;
let chosenClub=-1;

function screen(id){
 for(const name of ['welcome','menu','career','clubs']){
  document.getElementById(name).style.display=
    name===id?'flex':'none';
 }
}
function openCareer(){screen('career')}
function showOffice(){screen('menu')}
function openClubs(){
 pendingClub=chosenClub;
 updateClubSelection();
 screen('clubs');
}
function backToCareer(){screen('career')}
function chooseClub(i){
 pendingClub=i;
 updateClubSelection();
}
function updateClubSelection(){
 document.querySelectorAll('.club-choice')
  .forEach((b,i)=>{
   b.classList.toggle('selected',i===pendingClub);
  });
}
function confirmClub(){
 if(pendingClub<0){
  alert('Please choose your club.');
  return;
 }
 chosenClub=pendingClub;
 screen('career');
}
function startCareer(){
 const name=document.getElementById('managerName').value.trim();
 if(!name){
  alert('Please enter your manager name.');
  return;
 }
 if(chosenClub<0){
  alert('Please choose your club.');
  return;
 }
 const career={manager:name,club:teams[chosenClub]};
 localStorage.setItem('touchlineCareer',JSON.stringify(career));
 openDashboard();
}
const board=document.getElementById('clubBoard');
teams.forEach((team,i)=>{
 const button=document.createElement('button');
 button.className='club-choice';
 button.setAttribute('aria-label',team);
 button.style.left=(7.5+(i%3)*30.1)+'%';
 button.style.top=(34.5+Math.floor(i/3)*11.1)+'%';
 button.onclick=()=>chooseClub(i);
 board.appendChild(button);
});
</script>

<section id="dashboard" class="screen">
 <div class="dashboard-art" id="dashboardBoard">
 
</div>
</section>

<script>
const dashboardButtons=[
 'Squad','Tactics','Fixtures','League Table',
 'Transfers','Finances','Next Match','Save Game'
];

const dashboardBoard=document.getElementById('dashboardBoard');

dashboardButtons.forEach((name,i)=>{
 const b=document.createElement('button');
 b.className='dashboard-hit';
 b.setAttribute('aria-label',name);
 b.style.left=(13.5+(i%4)*19.2)+'%';
 b.style.top=(35.5+Math.floor(i/4)*24)+'%';
 b.onclick=()=>dashboardAction(name);
 dashboardBoard.appendChild(b);
});

function dashboardAction(name){
 if(name==='Save Game'){
  alert('Career saved successfully.');
  return;
 }
 alert(name+' screen coming next!');
}

function openDashboard(){
 for(const id of ['welcome','menu','career','clubs','dashboard']){
  document.getElementById(id).style.display=
   id==='dashboard'?'flex':'none';
 }
}

function continueCareer(){
 const saved=localStorage.getItem('touchlineCareer');
 if(!saved){
  alert('No saved career found.');
  return;
 }
 openDashboard();
}
</script>

<script>
function updateDashboardLive(){
 const el=document.getElementById('dashboardLive');
 if(!el)return;
 let career={};
 try{
  career=JSON.parse(
   localStorage.getItem('touchlineCareer')||'{}'
  );
 }catch(e){}
 el.textContent=
  'MANAGER: '+(career.manager||'Unknown')+
  '     |     CLUB: '+(career.club||'Not selected')+
  '     |     SEASON: 2026/27';
}
document.addEventListener('click',()=>{
 const d=document.getElementById('dashboard');
 if(d && d.style.display==='flex'){
  updateDashboardLive();
 }
});
updateDashboardLive();
</script>

<script>
const squadNames=[

const formations=['4-4-2','4-3-3','3-5-2'];

 name:p[0],

}));

function squadSave(){
 const career=JSON.parse(
  localStorage.getItem('touchlineCareer')||'{}'
 );
 if(!career.club)return;
 localStorage.setItem(
  'touchlineSquad_'+career.club,
  JSON.stringify({
   players:squadPlayers,
   formation:squadFormationIndex,

function squadLoad(){
 const career=JSON.parse(
  localStorage.getItem('touchlineCareer')||'{}'
 );
 const saved=localStorage.getItem(
  'touchlineSquad_'+career.club
 );
 squadPlayers=squadNames.map((p,i)=>({
  id:i,name:p[0],pos:p[1],age:p[2],rating:p[3]
 }));
 squadFormationIndex=0;
 if(!saved){
  const order=legacySlotOrder[0];
  squadPlayers=[...order.map(i=>squadPlayers[i]),...squadPlayers.slice(11)];
 }
 if(saved){
  try{
   const data=JSON.parse(saved);
   if(Array.isArray(data.players) &&
      data.players.length===25){
    squadPlayers=data.players;
     if(data.squadOrderVersion!==2){
      const order=legacySlotOrder[((data.formation||0)%3+3)%3];
      squadPlayers=[...order.map(i=>squadPlayers[i]),...squadPlayers.slice(11)];

     ((data.formation%3)+3)%3;

// Squad slots are always ordered goalkeeper, defence, midfield, attack.

const legacySlotOrder=[

function squadCompatible(player,slot){
 return (player.pos==='GK')===(slot==='GK');
}
function squadPick(i){
 if(squadSelected===-1){squadSelected=i;squadStatus.textContent='Tap another player to swap';}
 else if(squadSelected===i){squadSelected=-1;squadStatus.textContent='';}
 else{
  const a=squadSelected,layout=squadLayouts[squadFormationIndex];
  if((a<11&&!squadCompatible(squadPlayers[i],layout[a].p))||(i<11&&!squadCompatible(squadPlayers[a],layout[i].p))){
   squadStatus.textContent='Goalkeepers must stay in goal';
  }else{
   [squadPlayers[a],squadPlayers[i]]=[squadPlayers[i],squadPlayers[a]];
   squadStatus.textContent='Players swapped — confirm to save';
  }
  squadSelected=-1;
 }
 squadRender();
}
function squadRender(){
 const layout=squadLayouts[squadFormationIndex];
 document.getElementById('squadFormation').textContent=formations[squadFormationIndex];
 for(const id of ['squadXI','squadSubs','squadReserves','squadPitch'])document.getElementById(id).replaceChildren();
 squadPlayers.forEach((p,i)=>{
  const row=document.createElement('button');row.type='button';row.className='sq-row'+(i===squadSelected?' active':'');
  [i+1,p.name,p.pos,p.age,p.rating].forEach(v=>{const span=document.createElement('span');span.textContent=v;row.appendChild(span)});
  row.onclick=()=>squadPick(i);
  document.getElementById(i<11?'squadXI':i<18?'squadSubs':'squadReserves').appendChild(row);
  if(i<11){
   const marker=document.createElement('button');marker.type='button';marker.className='sq-marker'+(layout[i].p==='GK'?' goalkeeper':'')+(i===squadSelected?' active':'');
   marker.style.left=layout[i].x+'%';marker.style.top=layout[i].y+'%';
   marker.textContent=layout[i].p;marker.title=p.name+' ('+p.rating+')';marker.setAttribute('aria-label',p.name+' playing '+layout[i].p);
   marker.onclick=()=>squadPick(i);document.getElementById('squadPitch').appendChild(marker);
  }
 });
}
function squadFormationChange(direction){
 squadFormationIndex=(squadFormationIndex+direction+formations.length)%formations.length;
 // Reassign the existing XI to suitable slots; do not silently replace players.
 const slots=squadLayouts[squadFormationIndex];
 const pool=squadPlayers.slice(0,11), ordered=[];
 const score=(p,slot)=>p.pos===slot?100:(p.pos==='GK'&&slot==='GK'?100:(p.pos==='GK'||slot==='GK'?-1000:(({DC:['DL','DR'],DL:['DC','ML'],DR:['DC','MR'],MC:['AMC','ML','MR'],ML:['MC','AMC'],MR:['MC','AMC'],ST:['AMC'],AMC:['MC','ST']}[slot]||[]).includes(p.pos)?50:0)));
 for(const slot of slots){
  let best=0;
  for(let i=1;i<pool.length;i++)if(score(pool[i],slot.p)>score(pool[best],slot.p))best=i;
  ordered.push(pool.splice(best,1)[0]);
 }
 squadPlayers=[...ordered,...squadPlayers.slice(11)];
 squadSelected=-1;squadStatus.textContent='Formation: '+formations[squadFormationIndex];squadRender();
}
function squadAutoSelect(){
 const layout=squadLayouts[squadFormationIndex];const remaining=[...squadPlayers];const selected=[];
 const suitability=(player,slot)=>{
  if(!squadCompatible(player,slot))return -10000;
  if(player.pos===slot)return player.rating+12;
  const groups={DC:['DL','DR'],DL:['DC','ML'],DR:['DC','MR'],MC:['AMC','ML','MR'],ML:['MC','AMC'],MR:['MC','AMC'],ST:['AMC'],AMC:['MC','ST']};
  return player.rating+((groups[slot]||[]).includes(player.pos)?3:-10);
 };
 for(const slot of layout){
  let best=0;
  for(let i=1;i<remaining.length;i++)if(suitability(remaining[i],slot.p)>suitability(remaining[best],slot.p))best=i;
  selected.push(remaining.splice(best,1)[0]);
 }
 squadPlayers=[...selected,...remaining];squadSelected=-1;
 squadStatus.textContent='Strongest available team selected — confirm to save';squadRender();
}
function squadConfirm(){squadSave();squadSelected=-1;openDashboard();}
function squadBack(){squadSelected=-1;squadLoad();openDashboard();}
function openSquad(){
 squadLoad();squadSelected=-1;squadStatus.textContent='Tap two players to swap';
 for(const id of ['welcome','menu','career','clubs','dashboard','squadScreen']){
  const el=document.getElementById(id);if(el)el.style.display=id==='squadScreen'?'flex':'none';
 }
 squadRender();
}
const originalDashboardAction=dashboardAction;
dashboardAction=function(name){if(name==='Squad'){openSquad();return;}originalDashboardAction(name)};
</script>

<section id="tacticsScreen" class="screen"><div class="tac-art">
<div class="tac-title">TACTICS</div>
<div class="tac-panel tac-left"><div class="tac-heading">FORMATION</div><div id="tacFormations"></div><div class="tac-sep"></div><div class="tac-heading">MENTALITY</div><div id="tacMentalities"></div></div>
<div class="tac-panel tac-middle"><div class="tac-pitch" id="tacPitch"></div></div>
<div class="tac-panel tac-right"><div class="tac-heading">TEAM INSTRUCTIONS</div><div id="tacInstructions"></div></div>
<div class="tac-footer"><button type="button" onclick="tacticsBack()">BACK</button><button type="button" onclick="tacticsConfirm()">CONFIRM TACTICS</button></div>
</div></section>
<script>
const tacticInstructions=['Play Wider','Use The Wings','Through Balls','Press Higher','Hold Possession'];
const tacticMentalities=['Attacking','Balanced','Defensive'];
let tacticMentality='Balanced', tacticFlags=[false,false,false,false,false];
function tacticKey(){let career={};try{career=JSON.parse(localStorage.getItem('touchlineCareer')||'{}')}catch(e){}return 'touchlineTactics_'+(career.club||'default')}
function tacticsLoad(){
 squadLoad();
 tacticMentality='Balanced';tacticFlags=[false,false,false,false,false];
 try{const saved=JSON.parse(localStorage.getItem(tacticKey())||'null');if(saved){if(tacticMentalities.includes(saved.mentality))tacticMentality=saved.mentality;if(Array.isArray(saved.instructions)&&saved.instructions.length===5)tacticFlags=saved.instructions.map(Boolean)}}catch(e){}
}
function tacticsRender(){
 const forms=document.getElementById('tacFormations'),mental=document.getElementById('tacMentalities'),inst=document.getElementById('tacInstructions'),pitch=document.getElementById('tacPitch');
 forms.replaceChildren();mental.replaceChildren();inst.replaceChildren();pitch.replaceChildren();
 formations.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.className='tac-choice'+(squadFormationIndex===i?' selected':'');b.textContent=f;b.onclick=()=>{if(squadFormationIndex!==i){squadFormationChange((i-squadFormationIndex+formations.length)%formations.length)}tacticsRender()};forms.appendChild(b)});
 tacticMentalities.forEach(m=>{const b=document.createElement('button');b.type='button';b.className='tac-choice'+(tacticMentality===m?' selected':'');b.textContent=m;b.onclick=()=>{tacticMentality=m;tacticsRender()};mental.appendChild(b)});
 tacticInstructions.forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='tac-instruction'+(tacticFlags[i]?' selected':'');b.setAttribute('aria-pressed',String(tacticFlags[i]));const c=document.createElement('span');c.className='tac-check';c.textContent=tacticFlags[i]?'✓':'';const t=document.createElement('span');t.textContent=label;b.append(c,t);b.onclick=()=>{tacticFlags[i]=!tacticFlags[i];tacticsRender()};inst.appendChild(b)});
 squadLayouts[squadFormationIndex].forEach((slot,i)=>{const p=squadPlayers[i];if(!p)return;const b=document.createElement('span');b.className='tac-player'+(slot.p==='GK'?' gk':'');b.style.left=slot.x+'%';b.style.top=slot.y+'%';b.textContent=p.name.trim().split(/\s+/).slice(-1)[0];b.title=p.name;pitch.appendChild(b)});
}
function openTactics(){tacticsLoad();for(const id of ['welcome','menu','career','clubs','dashboard','squadScreen','tacticsScreen']){const el=document.getElementById(id);if(el)el.style.display=id==='tacticsScreen'?'flex':'none'}tacticsRender()}
function tacticsBack(){openDashboard()}
function tacticsConfirm(){squadSave();localStorage.setItem(tacticKey(),JSON.stringify({mentality:tacticMentality,instructions:tacticFlags}));openDashboard()}
const tacticsPreviousDashboardAction=dashboardAction;
dashboardAction=function(name){if(name==='Tactics'){openTactics();return}tacticsPreviousDashboardAction(name)};
</script>
